<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mehmet Kıvrak — Full Stack Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="40%" r="55%">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="318" rx="16"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,'SF Mono',Menlo,'Courier New',monospace}
      .fade{opacity:0;animation:in .8s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
      @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.fade{opacity:1;animation:none}.cursor{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect y="44" width="1200" height="276" fill="url(#grid)"/>
    <rect y="44" width="1200" height="276" fill="url(#glow)"/>

    <!-- browser bar -->
    <rect width="1200" height="44" fill="#161b22"/>
    <line x1="0" y1="44.5" x2="1200" y2="44.5" stroke="#30363d"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="6" fill="#febc2e"/>
    <circle cx="68" cy="22" r="6" fill="#28c840"/>
    <rect x="420" y="10" width="360" height="24" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="600" y="27" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">https://mehmetk.vercel.app</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- left: identity -->
  <text x="64" y="112" class="mono fade d1" font-size="18" fill="#8b949e">// merhaba, ben</text>
  <text x="62" y="180" class="sans fade d2" font-size="66" font-weight="800" fill="#ffffff">Mehmet Kıvrak</text>
  <rect x="64" y="198" width="56" height="4" rx="2" fill="url(#accent)" class="fade d2"/>
  <text x="64" y="240" class="sans fade d3" font-size="26" font-weight="600" fill="#61dafb">Full Stack Web Developer</text>
  <text x="64" y="278" class="mono fade d4" font-size="16" fill="#8b949e">Next.js · NestJS · Laravel · PostgreSQL · Docker</text>

  <!-- right: code card -->
  <g class="fade d3">
    <rect x="770" y="84" width="370" height="196" rx="12" fill="#161b22" stroke="#30363d"/>
    <g class="mono" font-size="16">
      <text x="790" y="122" fill="#484f58">1</text>
      <text x="790" y="152" fill="#484f58">2</text>
      <text x="790" y="182" fill="#484f58">3</text>
      <text x="790" y="212" fill="#484f58">4</text>
      <text x="790" y="242" fill="#484f58">5</text>

      <text x="818" y="122"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> mehmet</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="846" y="152"><tspan fill="#79c0ff">stack</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"full"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="846" y="182"><tspan fill="#79c0ff">focus</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"web"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="846" y="212"><tspan fill="#79c0ff">status</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#7ee787">"open to work"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="818" y="242" fill="#c9d1d9">};</text>
    </g>
    <rect x="842" y="228" width="10" height="18" fill="#61dafb" class="cursor"/>
  </g>
</svg>
